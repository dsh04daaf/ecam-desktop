<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECAM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 1. Falta la distro de WSL -->
  <section id="screen-install" class="screen center hidden">
    <h1 data-t="install_title"></h1>
    <p id="install-lead" class="lead" data-t="install_lead"></p>
    <p id="install-hint" class="hint"></p>
    <button id="btn-install" class="primary" data-t="install_go"></button>
  </section>

  <!-- 1b. Motor fuera de esta maquina (macOS/Linux: no hay WSL) -->
  <section id="screen-connect" class="screen center hidden">
    <h1 data-t="connect_title"></h1>
    <p class="lead" data-t="connect_lead"></p>
    <form id="form-connect">
      <input id="connect-addr" placeholder="127.0.0.1:10020" autocomplete="off" spellcheck="false" />
      <button class="primary" type="submit" data-t="connect_go"></button>
    </form>
    <p class="hint" data-t="connect_hint"></p>
    <p id="connect-error" class="error"></p>
  </section>

  <!-- 2. Login -->
  <section id="screen-login" class="screen center hidden">
    <h1 data-t="login_title"></h1>
    <p class="lead" data-t="login_lead"></p>
    <form id="form-login">
      <input id="login-user" type="email" data-t-ph="login_user" autocomplete="username" required />
      <input id="login-pass" type="password" data-t-ph="login_pass" autocomplete="current-password" required />
      <button class="primary" type="submit" data-t="login_go"></button>
    </form>
    <p id="login-error" class="error"></p>
  </section>

  <!-- 3. Código de verificación -->
  <section id="screen-2fa" class="screen center hidden">
    <h1 data-t="tfa_title"></h1>
    <p class="lead" data-t="tfa_lead"></p>
    <form id="form-2fa">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <button class="primary" type="submit" data-t="tfa_go"></button>
    </form>
    <p id="countdown" class="hint"></p>
    <p id="tfa-error" class="error"></p>
  </section>

  <!-- 4. La app -->
  <section id="screen-main" class="screen hidden">
    <header>
      <div class="brand">ECAM</div>
      <input id="q" type="search" data-t-ph="search_placeholder" />
      <select id="quality" title="ALAC / Atmos / AAC / Binaural">
        <option value="alac">ALAC</option>
        <option value="atmos">Atmos</option>
        <option value="aac">AAC</option>
        <option value="binaural">Binaural</option>
      </select>
      <button id="btn-settings" class="ghost" title="Ajustes">⚙</button>
    </header>

    <main>
      <div id="view">
        <!-- Card de un link pegado -->
        <div id="card" class="card-preview hidden"></div>

        <!-- Entidad abierta -->
        <div id="detail" class="detail hidden">
          <button id="back" class="ghost tiny" data-t="back"></button>
          <div class="dhead">
            <img id="d-art" alt="" />
            <div>
              <em id="d-kind"></em>
              <h2 id="d-name"></h2>
              <span id="d-artist"></span>
              <div class="drow">
                <button id="d-all" class="primary" data-t="download_all"></button>
                <select id="d-quality"></select>
                <span id="d-count" class="hint"></span>
              </div>
            </div>
          </div>
          <ul id="d-items" class="items"></ul>
        </div>

        <div id="results" class="grid"></div>
      </div>

      <aside id="panel">
        <nav class="tabs">
          <button class="tab on" data-tab="downloads" data-t="downloads"></button>
          <button class="tab" data-tab="history" data-t="history"></button>
          <button class="tab" data-tab="engine" data-t="engine"></button>
        </nav>

        <div id="tab-downloads" class="tabbody">
          <ul id="downloads"></ul>
        </div>

        <div id="tab-history" class="tabbody hidden">
          <button id="hist-clear" class="ghost tiny" data-t="clear_history"></button>
          <ul id="history"></ul>
        </div>

        <div id="tab-engine" class="tabbody hidden">
          <ul id="engine-state" class="state"></ul>
          <div class="row">
            <button id="eng-restart" class="ghost tiny" data-t="relaunch"></button>
            <button id="eng-signout" class="ghost tiny" data-t="sign_out"></button>
          </div>
          <h3 data-t="logs"></h3>
          <pre id="engine-logs"></pre>
        </div>
      </aside>
    </main>

    <dialog id="settings">
      <div class="dtop">
        <h2 data-t="settings"></h2>
        <button id="cfg-close" class="ghost tiny">✕</button>
      </div>
      <!-- El formulario se pinta desde el config que devuelve el core -->
      <div id="cfg-form"></div>
      <div class="wv">
        <span id="wv-state" class="hint"></span>
        <button id="wv-load" class="ghost tiny" data-t="import_widevine"></button>
      </div>
      <div class="row">
        <button id="cfg-save" class="primary" data-t="save"></button>
      </div>
    </dialog>
  </section>

  <script src="i18n.js"></script>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
