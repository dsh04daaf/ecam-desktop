name: build-windows

# Compila el instalador de ECAM Desktop para Windows.
#
# El binario NO lleva credenciales dentro (ni la llave de dispositivo de
# Widevine ni ninguna otra): se empaquetan como recurso al lado del ejecutable,
# donde se pueden reemplazar sin recompilar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      # El motor se prueba en el runner igual que en la VPS. Si el camino de
      # descifrado se rompe, el build falla antes de empaquetar nada.
      - name: Probar el core
        run: cargo test -p ecam-core --manifest-path Cargo.toml

      # Regresión del puente UI↔core: no necesita navegador, no hay excusa.
      - name: Probar el puente de la UI
        run: node --test tests/bridge.test.mjs

      # Que cada comando que llama la ventana exista de verdad en Rust. Sin
      # esto, una pulsación puede llamar a un comando inexistente y el fallo
      # solo aparece en la máquina del usuario.
      - name: Probar el contrato de comandos UI-Rust
        run: node --test tests/commands.test.mjs

      - name: Comprobar que no se cuela ninguna credencial en el binario
        shell: pwsh
        run: |
          $hits = Select-String -Path src-tauri/src/*.rs, core/src/**/*.rs `
            -Pattern 'BEGIN (RSA )?PRIVATE KEY' -SimpleMatch -ErrorAction SilentlyContinue
          if ($hits) { Write-Error "hay una llave privada en el código"; exit 1 }

      # ffmpeg va DENTRO del instalador: solo hace falta para el artwork
      # animado, pero pedirle al usuario que lo instale aparte significa que esa
      # función falla en silencio en casi todas las máquinas.
      - name: Embeber ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          Copy-Item (Get-ChildItem -Recurse fftmp -Filter ffmpeg.exe | Select-Object -First 1).FullName src-tauri/resources/ffmpeg.exe
          if (-not (Test-Path src-tauri/resources/ffmpeg.exe)) { Write-Error "ffmpeg no quedó en resources"; exit 1 }

      # El bug raíz de ECBP fue un flag de configuración ausente. Se comprueba.
      - name: Verificar withGlobalTauri
        shell: bash
        run: |
          node -e "
            const c = require('./src-tauri/tauri.conf.json');
            if (c.app.withGlobalTauri !== true) {
              console.error('withGlobalTauri no está activo: window.__TAURI__ no se inyectará y la app no hablará con su core');
              process.exit(1);
            }
            console.log('withGlobalTauri OK');
          "

      # Binario preconstruido en vez de `cargo install`: compilar el CLI desde
      # fuentes son ~400 crates y varios minutos en cada build.
      - name: Instalar Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Credenciales de Widevine (music videos). Se toman de los secretos si
      # están, y si no el instalador sale sin ellas: la app las puede importar
      # después desde Ajustes. Nunca van dentro del binario.
      - name: Empaquetar credenciales de Widevine
        if: env.WIDEVINE_DEVICE_KEY != ''
        env:
          WIDEVINE_DEVICE_KEY: ${{ secrets.WIDEVINE_DEVICE_KEY }}
          WIDEVINE_CLIENT_ID: ${{ secrets.WIDEVINE_CLIENT_ID }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/widevine | Out-Null
          [IO.File]::WriteAllBytes("src-tauri/resources/widevine/device.pem",
            [Convert]::FromBase64String($env:WIDEVINE_DEVICE_KEY))
          [IO.File]::WriteAllBytes("src-tauri/resources/widevine/client_id.bin",
            [Convert]::FromBase64String($env:WIDEVINE_CLIENT_ID))

      # OJO: `cargo build --release` compila el .exe pero NO empaqueta nada.
      # El instalador lo produce el CLI de Tauri.
      - name: Compilar la app y el instalador
        working-directory: src-tauri
        run: cargo tauri build

      - name: Recoger artefactos
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -name "*.exe" -exec cp {} dist/ \;
          cp src-tauri/target/release/ecam-desktop.exe dist/ECAM-portable.exe 2>/dev/null || true
          ls -la dist
          test -n "$(ls -A dist)" || { echo "no se generó ningún ejecutable"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ECAM-windows
          path: dist/*
          retention-days: 7

      - name: Publicar en el Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
