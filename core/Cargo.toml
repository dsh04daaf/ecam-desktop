[package]
name = "ecam-core"
version = "0.1.0"
edition = "2021"
description = "Motor de descarga de Apple Music de ECAM Desktop (port de apple-music-downloader a Rust)"

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
reqwest      = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio        = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time", "process"] }
futures      = "0.3"
regex        = "1"
once_cell    = "1"
thiserror    = "2"
dirs         = "5"
tracing      = "0.1"
base64       = "0.22"
hex          = "0.4"
quick-xml    = "0.37"
mp4ameta     = "0.11"
tempfile     = "3"
# Widevine (solo music videos): CDM propio, misma construcción que el CDM en Python.
aes          = "0.8"
cbc          = "0.1"
cmac         = "0.7"
rsa          = "0.9"
sha1         = "0.10"
rand         = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
